name: Build Weiwu X1 WiFi Firmware

on:
  workflow_dispatch:
    inputs:
      flash_assets:
        description: 'Flash Assets Type'
        required: true
        default: 'FLASH_DEFAULT_ASSETS'
        type: choice
        options:
          - FLASH_DEFAULT_ASSETS
          - FLASH_NONE_ASSETS
          - FLASH_EXPRESSION_ASSETS

jobs:
  build-weiwu-x1-wifi:
    name: Build Weiwu X1 WiFi (${{ inputs.flash_assets }})
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Weiwu X1 WiFi
        shell: bash
        env:
          FLASH_ASSETS: ${{ inputs.flash_assets }}
        run: |
          source $IDF_PATH/export.sh
          
          # 设置目标芯片
          idf.py set-target esp32s3
          
          # 合并 sdkconfig.defaults 和 sdkconfig.defaults.weiwu-x1-wifi
          cp sdkconfig.defaults sdkconfig.defaults.tmp
          cat sdkconfig.defaults.weiwu-x1-wifi >> sdkconfig.defaults.tmp
          
          # 添加 Flash Assets 类型配置
          echo "CONFIG_${FLASH_ASSETS}=y" >> sdkconfig.defaults.tmp
          
          mv sdkconfig.defaults.tmp sdkconfig.defaults
          
          # 编译
          idf.py -DBOARD_NAME=weiwu-x1-wifi -DBOARD_TYPE=weiwu-x1-wifi build

      - name: Merge Binary
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          # 使用和 scripts/release.py 中相同的合并方式
          python scripts/release.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weiwu-x1-wifi-${{ inputs.flash_assets }}
          path: build/merged-binary.bin
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-weiwu-x1-wifi-${{ inputs.flash_assets }}
          path: build/logs/
          if-no-files-found: ignore
