name: Build Weiwu X1 WiFi Firmware

on:
  workflow_dispatch:
    inputs:
      flash_assets:
        description: 'Flash Assets Type'
        required: true
        default: 'FLASH_DEFAULT_ASSETS'
        type: choice
        options:
          - FLASH_DEFAULT_ASSETS
          - FLASH_NONE_ASSETS
          - FLASH_EXPRESSION_ASSETS

jobs:
  build-weiwu-x1-wifi:
    name: Build Weiwu X1 WiFi (${{ inputs.flash_assets }})
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Weiwu X1 WiFi
        shell: bash
        env:
          FLASH_ASSETS: ${{ inputs.flash_assets }}
        run: |
          source $IDF_PATH/export.sh
          
          # 创建自定义配置文件
          cat > sdkconfig.defaults.weuwxi << 'EOF'
          # Weiwu X1 WiFi 8MB Flash 配置
          CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240=y
          
          # PSRAM 配置 (64MB Octal)
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_SPIRAM_SPEED_80M=y
          CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=2048
          CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=98304
          CONFIG_SPIRAM_MEMTEST=n
          CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
          
          # 缓存配置
          CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y
          CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
          
          # 分区表 (v2 8MB)
          CONFIG_PARTITION_TABLE_CUSTOM=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/8m.csv"
          CONFIG_PARTITION_TABLE_OFFSET=0x8000
          
          # 唤醒词模型
          CONFIG_SR_WN_WN9_NIHAOXIAOZHI_TTS=y
          
          # 板卡类型
          CONFIG_BOARD_TYPE_WEIWU_X1_WIFI=y
          
          # 禁用 OLED 显示
          CONFIG_DISPLAY_ENABLE=n
          
          # Flash Assets 类型
          CONFIG_${FLASH_ASSETS}=y
          EOF
          
          # 设置目标芯片
          idf.py set-target esp32s3
          
          # 合并默认配置
          cat sdkconfig.defaults >> sdkconfig.defaults.weuwxi
          mv sdkconfig.defaults.weuwxi sdkconfig.defaults
          
          # 编译
          idf.py -DBOARD_NAME=weiwu-x1-wifi -DBOARD_TYPE=weiwu-x1-wifi build

      - name: Merge Binary
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          # 手动合并必要的分区，不包含空的 ota_1 和 assets 分区
          esptool.py --chip esp32s3 merge_bin -o build/merged-binary.bin \
            --flash_mode dio --flash_size 8MB --flash_freq 80m \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x9000 build/ota_data_initial.bin \
            0x20000 build/xiaozhi.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weiwu-x1-wifi-${{ inputs.flash_assets }}
          path: build/merged-binary.bin
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-weiwu-x1-wifi-${{ inputs.flash_assets }}
          path: build/logs/
          if-no-files-found: ignore
