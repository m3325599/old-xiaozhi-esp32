name: ESP32-S3 Build Only

on:
  workflow_dispatch:
    inputs:
      board_type:
        description: 'ESP32-S3 board type to build (bread-compact-wifi, esp-box-3, m5stack-core-s3, atoms3r-echo-base, kevin-box-1)'
        required: false
        default: 'bread-compact-wifi'

env:
  IDF_VERSION: "v5.3"
  IDF_PATH: ${{ github.workspace }}/esp-idf
  TARGET: "esp32s3"
  BOARD_NAME: "bread-compact-wifi"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  esp32s3-build:
    runs-on: ubuntu-22.04
    
    name: Build ${{ env.BOARD_NAME }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache ESP-IDF
        id: cache-idf
        uses: actions/cache@v3
        with:
          path: ${{ env.IDF_PATH }}
          key: ${{ runner.os }}-idf-${{ env.IDF_VERSION }}-${{ env.TARGET }}

      - name: Setup ESP-IDF
        if: steps.cache-idf.outputs.cache-hit != 'true'
        run: |
          echo "Installing ESP-IDF ${{ env.IDF_VERSION }} for ${{ env.TARGET }}..."
          git clone --recursive --depth=1 -b ${{ env.IDF_VERSION }} https://github.com/espressif/esp-idf.git ${{ env.IDF_PATH }}
          cd ${{ env.IDF_PATH }}
          ./install.sh ${{ env.TARGET }}
      
      - name: Export IDF environment
        run: |
          cd ${{ env.IDF_PATH }}
          . ./export.sh
          echo "PATH=$PATH" >> $GITHUB_ENV
      
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r scripts/p3_tools/requirements.txt
      
      - name: Cache build
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/build
          key: ${{ runner.os }}-build-${{ env.TARGET }}-${{ matrix.board }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cc', '**/*.h') }}

      - name: Setup and Build
        run: |
          echo "Building ${{ env.BOARD_NAME }} for ${{ env.TARGET }}..."
          
          # 设置目标芯片
          idf.py set-target ${{ env.TARGET }}
          
          # 执行构建
          idf.py -DBOARD_NAME="${{ env.BOARD_NAME }}" build
          
          echo "✅ ${{ env.BOARD_NAME }} build completed"
      
      - name: Merge binary
        run: |
          echo "Creating merged binary for ${{ env.BOARD_NAME }}..."
          idf.py merge-bin
      
      - name: Create flash instructions
        run: |
          cat > flash_${{ env.BOARD_NAME }}.txt << 'EOF'
          # XiaoZhi ESP32-S3 ${{ env.BOARD_NAME }} Flash Instructions
          
          ## Method 1: One-click flash (recommended)
          esptool.py -p <PORT> -b 460800 write_flash 0 merged-binary.bin
          
          ## Method 2: Flash partitions separately
          esptool.py -p <PORT> -b 460800 write_flash \
            0x0 bootloader.bin \
            0x8000 partition-table.bin \
            0xd000 ota_data_initial.bin \
            0x100000 xiaozhi.bin
          
          Replace <PORT> with your serial port:
          - Linux: /dev/ttyUSB0, /dev/ttyACM0
          - Windows: COM3, COM4, etc.
          - macOS: /dev/cu.usbserial-*, /dev/cu.usbmodem*
          EOF
      
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BOARD_NAME }}-firmware
          path: |
            build/merged-binary.bin
            build/xiaozhi.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            sdkconfig
            flash_${{ env.BOARD_NAME }}.txt
          retention-days: 7
      
      - name: Build summary
        run: |
          echo "📦 Build Summary for ${{ env.BOARD_NAME }}"
          echo "Target: ${{ env.TARGET }}"
          echo "Status: ✅ Success"
          
          if [ -f "build/xiaozhi.bin" ]; then
            size=$(stat -c%s "build/xiaozhi.bin")
            echo "Firmware size: ${size} bytes"
          fi
          
          if [ -f "build/merged-binary.bin" ]; then
            size=$(stat -c%s "build/merged-binary.bin")
            echo "Merged binary: ${size} bytes"
          fi

  create-release:
    needs: esp32s3-build
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.board_type == 'release'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download bread-compact-wifi firmware
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BOARD_NAME }}-firmware
          path: artifacts/${{ env.BOARD_NAME }}/
      
      - name: Create release package
        run: |
          version="release-${GITHUB_RUN_NUMBER}"
          echo "Creating release package for ${{ env.BOARD_NAME }}..."
          
          mkdir -p release/${{ env.BOARD_NAME }}
          cp artifacts/${{ env.BOARD_NAME }}/* release/${{ env.BOARD_NAME }}/
          
          cd release
          zip -r "../xiaozhi-${{ env.BOARD_NAME }}-${version}.zip" ${{ env.BOARD_NAME }}
          cd ..
          
          echo "✅ Release package created: xiaozhi-${{ env.BOARD_NAME }}-${version}.zip"
          ls -la *.zip
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: "xiaozhi-${{ env.BOARD_NAME }}-*.zip"
          name: "XiaoZhi ${{ env.BOARD_NAME }} Build ${{ github.run_number }}"
          tag_name: "${{ env.BOARD_NAME }}-build-${{ github.run_number }}"
          generate_release_notes: true
          draft: false
          prerelease: false

  summary:
    needs: [esp32s3-build, create-release]
    runs-on: ubuntu-22.04
    if: always()
    
    steps:
      - name: Final Summary
        run: |
          if [ "${{ needs.esp32s3-build.result }}" = "success" ]; then
            echo "🎉 All ESP32-S3 builds completed successfully!"
          else
            echo "❌ Some ESP32-S3 builds failed"
            exit 1
          fi