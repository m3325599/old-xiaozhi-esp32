name: ESP32-S3 Build Only

on:
  workflow_dispatch:

env:
  TARGET: "esp32s3"
  BOARD_NAME: "weiwu-x1-wifi"

jobs:
  esp32s3-build:
    runs-on: ubuntu-22.04
    container:
      image: espressif/idf:v5.3
      options: --user root
    
    name: Build weiwu-x1-wifi
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: old-xiaozhi-esp32
      
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            old-xiaozhi-esp32/build
            old-xiaozhi-esp32/managed_components
          key: ${{ runner.os }}-build-${{ env.TARGET }}-${{ env.BOARD_NAME }}-${{ hashFiles('old-xiaozhi-esp32/**/CMakeLists.txt', 'old-xiaozhi-esp32/**/*.cc', 'old-xiaozhi-esp32/**/*.h', 'old-xiaozhi-esp32/main/idf_component.yml') }}
      
      - name: Install project dependencies
        working-directory: old-xiaozhi-esp32
        run: |
          # Install pip first
          apt-get update && apt-get install -y python3-pip
          # Then install project requirements
          python3 -m pip install --upgrade pip
          pip3 install -r scripts/p3_tools/requirements.txt
      
      - name: Full clean before build
        working-directory: old-xiaozhi-esp32
        run: |
          echo "🧹 Full clean to avoid component version conflicts..."
          rm -rf managed_components build
          echo "✅ Clean complete"
      
      - name: Setup and Build
        working-directory: old-xiaozhi-esp32
        run: |
          echo "Building weiwu-x1-wifi for ${{ env.TARGET }}..."
          
          # Source IDF environment to make idf.py available
          . /opt/esp/idf/export.sh
          
          # 设置目标芯片（会自动下载managed_components）
          idf.py set-target ${{ env.TARGET }}
          
          # 执行构建
          idf.py -DBOARD_NAME="weiwu-x1-wifi" build
          
          echo "✅ weiwu-x1-wifi build completed"
      
      - name: Merge binary
        working-directory: old-xiaozhi-esp32
        run: |
          echo "Creating merged binary for weiwu-x1-wifi..."
          # Source IDF environment
          . /opt/esp/idf/export.sh
          idf.py merge-bin
      
      - name: Create flash instructions
        working-directory: old-xiaozhi-esp32
        run: |
          cat > flash_weiwu-x1-wifi.txt << 'EOF'
          # XiaoZhi ESP32-S3 weiwu-x1-wifi Flash Instructions
          
          ## Method 1: One-click flash (recommended)
          esptool.py -p <PORT> -b 460800 write_flash 0 merged-binary.bin
          
          ## Method 2: Flash partitions separately
          esptool.py -p <PORT> -b 460800 write_flash \\
            0x0 bootloader.bin \\
            0x8000 partition-table.bin \\
            0xd000 ota_data_initial.bin \\
            0x100000 xiaozhi.bin
          
          Replace <PORT> with your serial port:
          - Linux: /dev/ttyUSB0, /dev/ttyACM0
          - Windows: COM3, COM4, etc.
          - macOS: /dev/cu.usbserial-*, /dev/cu.usbmodem*
          EOF
      
      - name: Copy firmware to release
        working-directory: old-xiaozhi-esp32
        run: |
          echo "Copying firmware to release directory..."
          # Source IDF environment
          . /opt/esp/idf/export.sh
          
          # Create release directory structure
          mkdir -p release/weiwu-x1-wifi-v$GITHUB_RUN_NUMBER
          
          # Copy main firmware files
          cp build/merged-binary.bin release/weiwu-x1-wifi-v$GITHUB_RUN_NUMBER/merged-binary-weiwu-x1-wifi-v$GITHUB_RUN_NUMBER.bin
          cp build/xiaozhi.bin release/weiwu-x1-wifi-v$GITHUB_RUN_NUMBER/xiaozhi-weiwu-x1-wifi-v$GITHUB_RUN_NUMBER.bin
          cp build/bootloader/bootloader.bin release/weiwu-x1-wifi-v$GITHUB_RUN_NUMBER/bootloader.bin
          cp build/partition_table/partition-table.bin release/weiwu-x1-wifi-v$GITHUB_RUN_NUMBER/partition-table.bin
          cp build/ota_data_initial.bin release/weiwu-x1-wifi-v$GITHUB_RUN_NUMBER/ota_data_initial.bin
          cp sdkconfig release/weiwu-x1-wifi-v$GITHUB_RUN_NUMBER/sdkconfig
          cp flash_weiwu-x1-wifi.txt release/weiwu-x1-wifi-v$GITHUB_RUN_NUMBER/
          
          echo "✅ Firmware copied to release/weiwu-x1-wifi-v$GITHUB_RUN_NUMBER/"
          ls -la release/weiwu-x1-wifi-v$GITHUB_RUN_NUMBER/
      
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: weiwu-x1-wifi-firmware
          path: |
            old-xiaozhi-esp32/build/merged-binary.bin
            old-xiaozhi-esp32/build/xiaozhi.bin
            old-xiaozhi-esp32/build/bootloader/bootloader.bin
            old-xiaozhi-esp32/build/partition_table/partition-table.bin
            old-xiaozhi-esp32/build/ota_data_initial.bin
            old-xiaozhi-esp32/sdkconfig
            old-xiaozhi-esp32/flash_weiwu-x1-wifi.txt
          retention-days: 7
      
      - name: Build summary
        working-directory: old-xiaozhi-esp32
        run: |
          echo "📦 Build Summary for weiwu-x1-wifi"
          echo "Target: ${{ env.TARGET }}"
          echo "Status: ✅ Success"
          
          if [ -f "build/xiaozhi.bin" ]; then
            size=$(stat -c%s "build/xiaozhi.bin")
            echo "Firmware size: ${size} bytes"
          fi
          
          if [ -f "build/merged-binary.bin" ]; then
            size=$(stat -c%s "build/merged-binary.bin")
            echo "Merged binary: ${size} bytes"
          fi

  create-release:
    needs: esp32s3-build
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      actions: read
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Download weiwu-x1-wifi firmware
        uses: actions/download-artifact@v4
        with:
          name: weiwu-x1-wifi-firmware
          path: artifacts/weiwu-x1-wifi/
      
      - name: Create release package
        run: |
          version="release-${GITHUB_RUN_NUMBER}"
          echo "Creating release package for weiwu-x1-wifi..."
          
          mkdir -p release/weiwu-x1-wifi
          cp -r artifacts/weiwu-x1-wifi/* release/weiwu-x1-wifi/
          
          cd release
          zip -r "../xiaozhi-weiwu-x1-wifi-${version}.zip" weiwu-x1-wifi
          cd ..
          
          echo "✅ Release package created: xiaozhi-weiwu-x1-wifi-${version}.zip"
          ls -la *.zip
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: "xiaozhi-weiwu-x1-wifi-*.zip"
          name: "XiaoZhi weiwu-x1-wifi Build ${{ github.run_number }}"
          tag_name: "weiwu-x1-wifi-build-${{ github.run_number }}"
          generate_release_notes: true
          draft: false
          prerelease: false

  summary:
    needs: [esp32s3-build, create-release]
    runs-on: ubuntu-22.04
    if: always()
    
    steps:
      - name: Final Summary
        run: |
          if [ "${{ needs.esp32s3-build.result }}" = "success" ]; then
            echo "🎉 All ESP32-S3 builds completed successfully!"
          else
            echo "❌ Some ESP32-S3 builds failed"
            exit 1
          fi