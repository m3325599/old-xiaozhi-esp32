name: Build Weiwu X1 WiFi Firmware

on:
  push:
    branches: [ main, master ]
    paths:
      - 'main/**'
      - 'sdkconfig.defaults*'
      - 'partitions*.csv'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build firmware
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.3.1
        target: esp32s3
        command: |
          rm -f sdkconfig
          cp sdkconfig.defaults.weiwu-x1-wifi sdkconfig
          idf.py set-target esp32s3
          idf.py build
          # 直接使用 v1.5.2 绿板完整固件作为基础
          cp release/v1.5.2/merged-binary-v1.5.2绿.bin build/merged-binary.bin
          # 使用 Python 替换 merged-binary.bin 中的应用程序部分（ota_0 分区 @ 0x100000）
          echo "x = open('build/xiaozhi.bin', 'rb').read(); m = bytearray(open('build/merged-binary.bin', 'rb').read()); m[0x100000:0x100000+len(x)] = x; open('build/merged-binary.bin', 'wb').write(m)" > replace_firmware.py
          python3 replace_firmware.py
          rm replace_firmware.py
          # Generate flash info inside the container to avoid permission issues
          cd build && python3 ../scripts/generate_flash_info.py "$GITHUB_SHA"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: weiwu-x1-wifi-firmware
        path: |
          build/merged-binary.bin
          build/xiaozhi.bin
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/ota_data_initial.bin
          build/flash_info.txt
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: weiwu-x1-wifi-build-${{ github.run_number }}
        name: Weiwu X1 WiFi Build ${{ github.run_number }}
        body: |
          ## 微五 X1 WiFi 版固件 - 绿板配置
          
          - **构建版本**: ${{ github.run_number }}
          - **Git 提交**: ${{ github.sha }}
          
          ### 硬件配置
          - 麦克风: I2S Simplex 模式 (GPIO42/40/2)
          - 扬声器: I2S (GPIO15/16/17/18)
          - BOOT 按键: GPIO0 (绿板)
          - 触摸按键: GPIO5
          - LED: GPIO8/48
          - Flash: 8MB
          - 无 OLED 显示屏
          
          ### 文件说明
          - **merged-binary.bin**: 一键刷入固件（推荐，包含所有分区）
          - xiaozhi.bin: 应用程序固件
          - bootloader.bin: 引导程序
          - partition-table.bin: 分区表
          - ota_data_initial.bin: OTA初始数据
          
          ### 一键刷入命令（推荐）
          ```bash
          esptool.py --chip esp32s3 --port COMx --baud 921600 write_flash 0x0 merged-binary.bin
          ```
          
          ### 分区刷入命令
          ```bash
          esptool.py --chip esp32s3 --port COMx --baud 921600 write_flash \
            0x0 bootloader.bin \
            0x8000 partition-table.bin \
            0xd000 ota_data_initial.bin \
            0x10000 srmodels/srmodels.bin \
            0x100000 xiaozhi.bin
          ```
        files: |
          build/merged-binary.bin
          build/xiaozhi.bin
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/ota_data_initial.bin
          build/flash_info.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
