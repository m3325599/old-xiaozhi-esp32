name: Build Weiwu X1 WiFi Firmware (v1.5.2)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'main/**'
      - 'sdkconfig.defaults*'
      - 'partitions*.csv'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-weiwu-x1-wifi:
    name: Build Weiwu X1 WiFi
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Weiwu X1 WiFi
        shell: bash
        working-directory: .
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          source $IDF_PATH/export.sh
          
          # 修改 CMakeLists.txt 添加编译序号
          sed -i "s/set(PROJECT_VER \"1.5.2\")/set(PROJECT_VER \"1.5.2-build-$BUILD_NUMBER\")/" CMakeLists.txt
          echo "已修改版本为: 1.5.2-build-$BUILD_NUMBER"
          
          # =========== 关键修复：先配置好 sdkconfig.defaults ===========
          echo "确保 sdkconfig.defaults 中只有 8MB Flash..."
          
          # 删除任何 16MB 配置
          sed -i '/CONFIG_ESPTOOLPY_FLASHSIZE_16MB/d' sdkconfig.defaults
          
          # 确保 8MB 配置存在
          if ! grep -q "CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y" sdkconfig.defaults; then
              echo "CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y" >> sdkconfig.defaults
          fi
          
          # 验证
          echo "sdkconfig.defaults 中的 Flash 设置:"
          grep "ESPTOOLPY_FLASHSIZE" sdkconfig.defaults
          
          # =========== 现在才初始化目标并编译 ===========
          idf.py set-target esp32s3
          idf.py fullclean
          idf.py reconfigure
          
          # 验证生成的 sdkconfig
          echo "生成的 sdkconfig 中的 Flash 设置:"
          grep "ESPTOOLPY_FLASHSIZE" sdkconfig
          
          # 构建
          idf.py build
          
          # 检查构建产物
          echo "构建产物列表:"
          ls -la build/
          ls -la build/bootloader/ 2>/dev/null || echo "bootloader 目录不存在"
          ls -la build/partition_table/ 2>/dev/null || echo "partition_table 目录不存在"
          
          # 使用 idf.py merge-bin 合并（使用正确配置的 sdkconfig）
          echo "使用 idf.py merge-bin 合并固件..."
          idf.py merge-bin -o "build/weiwu-x1-wifi-$BUILD_NUMBER.bin"
          
          # 检查固件大小
          ls -lh "build/weiwu-x1-wifi-$BUILD_NUMBER.bin"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weiwu-x1-wifi-${{ github.run_number }}
          path: build/weiwu-x1-wifi-${{ github.run_number }}.bin
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-weiwu-x1-wifi-${{ github.run_number }}
          path: build/logs/
          if-no-files-found: ignore

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: weiwu-x1-wifi-build-${{ github.run_number }}
          name: Weiwu X1 WiFi Build ${{ github.run_number }}
          body: |
            ## 微五 X1 WiFi 版固件 - xiaozhi-v1.5.2
            
            - **构建版本**: ${{ github.run_number }}
            - **Git 提交**: ${{ github.sha }}
            
            ### 硬件配置
            - 芯片: ESP32-S3
            - Flash: 8MB
            - PSRAM: 64MB Octal
            - 无 OLED 显示屏
            
            ### 串口日志识别
            - 版本号会显示为: `1.5.2-build-${{ github.run_number }}`
            
            ### 文件说明
            - **weiwu-x1-wifi-${{ github.run_number }}.bin**: 一键刷入固件（推荐，包含所有分区）
            
            ### 一键刷入命令（推荐）
            ```bash
            esptool.py --chip esp32s3 --port COMx --baud 921600 write_flash 0x0 weiwu-x1-wifi-${{ github.run_number }}.bin
            ```
          files: |
            build/weiwu-x1-wifi-${{ github.run_number }}.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
