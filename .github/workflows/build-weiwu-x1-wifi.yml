name: Build Weiwu X1 WiFi Firmware (v1.5.2)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'main/**'
      - 'sdkconfig.defaults*'
      - 'partitions*.csv'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-weiwu-x1-wifi:
    name: Build Weiwu X1 WiFi
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Weiwu X1 WiFi
        shell: bash
        working-directory: .
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          
          source $IDF_PATH/export.sh
          
          echo "=== 1. 修改版本号 ==="
          sed -i "s/set(PROJECT_VER \"1.5.2\")/set(PROJECT_VER \"1.5.2-build-$BUILD_NUMBER\")/" CMakeLists.txt
          echo "版本号: 1.5.2-build-$BUILD_NUMBER"
          
          echo ""
          echo "=== 2. 配置 sdkconfig.defaults ==="
          echo "删除 16MB 配置..."
          sed -i '/CONFIG_ESPTOOLPY_FLASHSIZE_16MB/d' sdkconfig.defaults || echo "没有找到 16MB 配置"
          
          echo "确保 8MB 配置存在..."
          if grep -q "CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y" sdkconfig.defaults; then
              echo "8MB 配置已存在"
          else
              echo "CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y" >> sdkconfig.defaults
              echo "已添加 8MB 配置"
          fi
          
          echo ""
          echo "=== 3. 验证配置 ==="
          echo "sdkconfig.defaults:"
          grep "ESPTOOLPY_FLASHSIZE" sdkconfig.defaults
          
          echo ""
          echo "=== 4. 设置目标 ==="
          idf.py set-target esp32s3
          
          echo ""
          echo "=== 5. 清理 ==="
          idf.py fullclean
          
          echo ""
          echo "=== 6. 重新配置 ==="
          idf.py reconfigure
          
          echo ""
          echo "=== 7. 验证生成的 sdkconfig ==="
          echo "sdkconfig:"
          grep "ESPTOOLPY_FLASHSIZE" sdkconfig
          
          echo ""
          echo "=== 8. 构建 ==="
          idf.py build 2>&1 | tail -50 || exit 1
          
          echo ""
          echo "=== 9. 合并固件 ==="
          idf.py merge-bin -o "build/weiwu-x1-wifi-$BUILD_NUMBER.bin"
          
          echo ""
          echo "=== 10. 检查固件 ==="
          ls -lh "build/weiwu-x1-wifi-$BUILD_NUMBER.bin"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weiwu-x1-wifi-${{ github.run_number }}
          path: build/weiwu-x1-wifi-${{ github.run_number }}.bin
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-weiwu-x1-wifi-${{ github.run_number }}
          path: build/logs/
          if-no-files-found: ignore

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: weiwu-x1-wifi-build-${{ github.run_number }}
          name: Weiwu X1 WiFi Build ${{ github.run_number }}
          body: |
            ## 微五 X1 WiFi 版固件 - xiaozhi-v1.5.2
            
            - **构建版本**: ${{ github.run_number }}
            - **Git 提交**: ${{ github.sha }}
            
            ### 硬件配置
            - 芯片: ESP32-S3
            - Flash: 8MB
            - PSRAM: 64MB Octal
            - 无 OLED 显示屏
            
            ### 串口日志识别
            - 版本号会显示为: `1.5.2-build-${{ github.run_number }}`
            
            ### 文件说明
            - **weiwu-x1-wifi-${{ github.run_number }}.bin**: 一键刷入固件（推荐，包含所有分区）
            
            ### 一键刷入命令（推荐）
            ```bash
            esptool.py --chip esp32s3 --port COMx --baud 921600 write_flash 0x0 weiwu-x1-wifi-${{ github.run_number }}.bin
            ```
          files: |
            build/weiwu-x1-wifi-${{ github.run_number }}.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
