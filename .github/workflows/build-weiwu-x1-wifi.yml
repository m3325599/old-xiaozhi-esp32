name: Build Weiwu X1 WiFi Firmware (v1.5.2)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'main/**'
      - 'sdkconfig.defaults*'
      - 'partitions*.csv'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-weiwu-x1-wifi:
    name: Build Weiwu X1 WiFi
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Weiwu X1 WiFi
        shell: bash
        working-directory: .
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          source $IDF_PATH/export.sh
          
          # 修改 CMakeLists.txt 添加编译序号
          sed -i "s/set(PROJECT_VER \"1.5.2\")/set(PROJECT_VER \"1.5.2-build-$BUILD_NUMBER\")/" CMakeLists.txt
          echo "已修改版本为: 1.5.2-build-$BUILD_NUMBER"
          
          # 初始化目标
          idf.py set-target esp32s3
          
          # 清理
          idf.py fullclean
          
          # =========== 关键修复：强制修改 sdkconfig ===========
          echo "强制设置 Flash 大小为 8MB..."
          
          # 确保 sdkconfig 中禁用 16MB，启用 8MB
          if [ -f sdkconfig ]; then
              # 禁用 16MB
              sed -i '/CONFIG_ESPTOOLPY_FLASHSIZE_16MB/d' sdkconfig
              sed -i 's/CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y/# CONFIG_ESPTOOLPY_FLASHSIZE_16MB is not set/' sdkconfig || true
              
              # 启用 8MB
              if ! grep -q "CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y" sdkconfig; then
                  echo "CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y" >> sdkconfig
              fi
          fi
          
          # 同时修改 sdkconfig.defaults
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y" >> sdkconfig.defaults
          sed -i '/CONFIG_ESPTOOLPY_FLASHSIZE_16MB/d' sdkconfig.defaults
          
          # 验证 Flash 大小设置
          echo "验证 sdkconfig 中的 Flash 设置："
          grep -n "ESPTOOLPY_FLASHSIZE" sdkconfig || true
          echo "验证 sdkconfig.defaults 中的 Flash 设置："
          grep -n "ESPTOOLPY_FLASHSIZE" sdkconfig.defaults || true
          
          # 构建
          python scripts/release.py weiwu-x1-wifi
          
          # 重命名固件文件，添加编译序号
          if [ -f build/merged-binary.bin ]; then
              mv build/merged-binary.bin "build/weiwu-x1-wifi-$BUILD_NUMBER.bin"
              echo "固件已重命名为: weiwu-x1-wifi-$BUILD_NUMBER.bin"
              
              # 检查固件大小
              ls -lh build/weiwu-x1-wifi-$BUILD_NUMBER.bin
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weiwu-x1-wifi-${{ github.run_number }}
          path: build/weiwu-x1-wifi-${{ github.run_number }}.bin
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-weiwu-x1-wifi-${{ github.run_number }}
          path: build/logs/
          if-no-files-found: ignore

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: weiwu-x1-wifi-build-${{ github.run_number }}
          name: Weiwu X1 WiFi Build ${{ github.run_number }}
          body: |
            ## 微五 X1 WiFi 版固件 - xiaozhi-v1.5.2
            
            - **构建版本**: ${{ github.run_number }}
            - **Git 提交**: ${{ github.sha }}
            
            ### 硬件配置
            - 芯片: ESP32-S3
            - Flash: 8MB
            - PSRAM: 64MB Octal
            - 无 OLED 显示屏
            
            ### 串口日志识别
            - 版本号会显示为: `1.5.2-build-${{ github.run_number }}`
            
            ### 文件说明
            - **weiwu-x1-wifi-${{ github.run_number }}.bin**: 一键刷入固件（推荐，包含所有分区）
            
            ### 一键刷入命令（推荐）
            ```bash
            esptool.py --chip esp32s3 --port COMx --baud 921600 write_flash 0x0 weiwu-x1-wifi-${{ github.run_number }}.bin
            ```
          files: |
            build/weiwu-x1-wifi-${{ github.run_number }}.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
