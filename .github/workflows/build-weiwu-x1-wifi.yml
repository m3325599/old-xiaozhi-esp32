name: Build Weiwu X1 WiFi Firmware

on:
  push:
    branches: [ main, master ]
    paths:
      - 'main/**'
      - 'sdkconfig.defaults*'
      - 'partitions/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build firmware (v2.2.6)
      shell: bash
      run: |
        source $IDF_PATH/export.sh
        rm -rf build sdkconfig
        python scripts/release.py weiwu-x1-wifi --name weiwu-x1-wifi

    - name: Extract v1.5.2 bootloader (known working)
      shell: bash
      run: |
        git config --global --add safe.directory /__w/old-xiaozhi-esp32/old-xiaozhi-esp32
        git fetch origin backup-v1.5.2
        git checkout origin/backup-v1.5.2 -- "release/v1.5.2/merged-binary-v1.5.2绿.bin"
        dd if="release/v1.5.2/merged-binary-v1.5.2绿.bin" of=build/bootloader/bootloader_v152.bin bs=1024 count=32
        echo "v1.5.2 bootloader size: $(stat -c%s build/bootloader/bootloader_v152.bin) bytes"

    - name: Re-create merged binary (v1.5.2 bootloader + v2.2.6 app)
      shell: bash
      run: |
        source $IDF_PATH/export.sh
        esptool.py --chip esp32s3 merge_bin \
          --flash_mode dio --flash_size 8MB \
          -o build/merged-binary.bin \
          0x0 build/bootloader/bootloader_v152.bin \
          0x8000 build/partition_table/partition-table.bin \
          0xd000 build/ota_data_initial.bin \
          0x20000 build/xiaozhi.bin
        echo "Merged binary size: $(stat -c%s build/merged-binary.bin) bytes"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: weiwu-x1-wifi-firmware
        path: |
          build/merged-binary.bin
          build/xiaozhi.bin
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/ota_data_initial.bin
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: weiwu-x1-wifi-build-${{ github.run_number }}
        name: Weiwu X1 WiFi Build ${{ github.run_number }}
        body: |
          ## 微五 X1 WiFi 版固件 - v2.2.6

          - **构建版本**: ${{ github.run_number }}
          - **Git 提交**: ${{ github.sha }}
          - **项目版本**: v2.2.6
          
          ### 硬件配置
          - 麦克风: I2S Simplex 模式 (GPIO42/40/2)
          - 扬声器: I2S (GPIO15/16/17/18)
          - BOOT 按键: GPIO0 (绿板)
          - 触摸按键: GPIO5
          - LED: GPIO8/48
          - Flash: 8MB
          - 无 OLED 显示屏
          
          ### 文件说明
          - **merged-binary.bin**: 一键刷入固件（推荐，包含所有分区）
          - xiaozhi.bin: 应用程序固件
          - bootloader.bin: 引导程序
          - partition-table.bin: 分区表
          - ota_data_initial.bin: OTA初始数据
          
          ### 一键刷入命令（推荐）
          ```bash
          esptool.py --chip esp32s3 --port COMx --baud 921600 write_flash 0x0 merged-binary.bin
          ```
          
          ### 分区刷入命令
          ```bash
          esptool.py --chip esp32s3 --port COMx --baud 921600 write_flash \
            0x0 bootloader.bin \
            0x8000 partition-table.bin \
            0xd000 ota_data_initial.bin \
            0x20000 xiaozhi.bin
          ```
        files: |
          build/merged-binary.bin
          build/xiaozhi.bin
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/ota_data_initial.bin
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# Trigger workflow