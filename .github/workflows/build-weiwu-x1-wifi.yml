name: Build Weiwu X1 WiFi Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build firmware and create merged binary
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.3.1
        target: esp32s3
        command: |
          rm -f sdkconfig
          cp sdkconfig.defaults.weiwu-x1-wifi sdkconfig
          idf.py set-target esp32s3
          idf.py build
          cd build
          esptool.py --chip esp32s3 merge_bin -o merged-binary.bin --flash_mode dio --flash_size 8MB 0x0 bootloader/bootloader.bin 0x8000 partition_table/partition-table.bin 0xd000 ota_data_initial.bin 0x10000 xiaozhi.bin
          echo "========================================" > flash_info.txt
          echo "微五 X1 WiFi 版固件 - 绿板配置" >> flash_info.txt
          echo "========================================" >> flash_info.txt
          echo "" >> flash_info.txt
          echo "版本: BUILD_VERSION_PLACEHOLDER" >> flash_info.txt
          echo "提交: BUILD_SHA_PLACEHOLDER" >> flash_info.txt
          echo "构建时间: $(date '+%Y-%m-%d %H:%M:%S')" >> flash_info.txt
          echo "" >> flash_info.txt
          echo "文件说明:" >> flash_info.txt
          echo "- merged-binary.bin: 一键刷入固件（推荐）" >> flash_info.txt
          echo "- xiaozhi.bin: 应用程序固件" >> flash_info.txt
          echo "- bootloader.bin: 引导程序" >> flash_info.txt
          echo "- partition-table.bin: 分区表" >> flash_info.txt
          echo "- ota_data_initial.bin: OTA初始数据" >> flash_info.txt
          echo "" >> flash_info.txt
          echo "========================================" >> flash_info.txt
          echo "一键刷入命令（推荐）:" >> flash_info.txt
          echo "========================================" >> flash_info.txt
          echo "esptool.py --chip esp32s3 --port COMx --baud 921600 write_flash 0x0 merged-binary.bin" >> flash_info.txt
          echo "" >> flash_info.txt
          echo "或刷入单个文件:" >> flash_info.txt
          echo "esptool.py --chip esp32s3 --port COMx --baud 921600 write_flash \\" >> flash_info.txt
          echo "  0x0 bootloader/bootloader.bin \\" >> flash_info.txt
          echo "  0x8000 partition-table.bin \\" >> flash_info.txt
          echo "  0xd000 ota_data_initial.bin \\" >> flash_info.txt
          echo "  0x10000 xiaozhi.bin" >> flash_info.txt
          echo "" >> flash_info.txt
          echo "========================================" >> flash_info.txt
          echo "硬件配置:" >> flash_info.txt
          echo "========================================" >> flash_info.txt
          echo "- 麦克风: I2S Simplex (GPIO42/40/2)" >> flash_info.txt
          echo "- 扬声器: I2S (GPIO15/16/17/18)" >> flash_info.txt
          echo "- BOOT按键: GPIO0 (绿板)" >> flash_info.txt
          echo "- 触摸按键: GPIO5" >> flash_info.txt
          echo "- LED: GPIO8/48" >> flash_info.txt
          echo "- Flash: 8MB" >> flash_info.txt
          echo "- 无 OLED 显示屏" >> flash_info.txt
          echo "========================================" >> flash_info.txt

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: weiwu-x1-wifi-firmware
        path: |
          build/merged-binary.bin
          build/xiaozhi.bin
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/ota_data_initial.bin
          build/flash_info.txt
        retention-days: 30

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: weiwu-x1-wifi-build-${{ github.run_number }}
        name: Weiwu X1 WiFi Build ${{ github.run_number }}
        body: |
          ## 微五 X1 WiFi 版固件 - 绿板配置
          
          - **构建版本**: ${{ github.run_number }}
          - **Git 提交**: ${{ github.sha }}
          
          ### 硬件配置
          - 麦克风: I2S Simplex 模式 (GPIO42/40/2)
          - 扬声器: I2S (GPIO15/16/17/18)
          - BOOT 按键: GPIO0 (绿板)
          - 触摸按键: GPIO5
          - LED: GPIO8/48
          - Flash: 8MB
          - 无 OLED 显示屏
          
          ### 文件说明
          - **merged-binary.bin**: 一键刷入固件（推荐，包含所有分区）
          - xiaozhi.bin: 应用程序固件
          - bootloader.bin: 引导程序
          - partition-table.bin: 分区表
          - ota_data_initial.bin: OTA初始数据
          
          ### 一键刷入命令（推荐）
          ```bash
          esptool.py --chip esp32s3 --port COMx --baud 921600 write_flash 0x0 merged-binary.bin
          ```
          
          ### 分区刷入命令
          ```bash
          esptool.py --chip esp32s3 --port COMx --baud 921600 write_flash \
            0x0 bootloader.bin \
            0x8000 partition-table.bin \
            0xd000 ota_data_initial.bin \
            0x10000 xiaozhi.bin
          ```
        files: |
          build/merged-binary.bin
          build/xiaozhi.bin
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/ota_data_initial.bin
          build/flash_info.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
